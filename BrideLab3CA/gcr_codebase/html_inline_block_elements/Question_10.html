
<!DOCTYPE html>
<html>
<head>
    <title>Dropdown Selection</title>
</head>

<body>

    <h1>Selection Page</h1>

    <label>Country:</label>
    <select>
        <option selected>India</option>
        <option>USA</option>
        <option>UK</option>
    </select>

    <br><br>

    <label>State:</label>
    <select>
        <option selected>Uttar Pradesh</option>
        <option>Delhi</option>
        <option>Maharashtra</option>
    </select>

    <br><br>

    <label>City:</label>
    <select>
        <option selected>Agra</option>
        <option>Lucknow</option>
        <option>Kanpur</option>
    </select>

    <br><br>

    <label>Favorite Tourist Place:</label>
    <select>
        <option selected>Taj Mahal</option>
        <option>Agra Fort</option>
        <option>Fatehpur Sikri</option>
    </select>

    <p>
        My choices are India, Uttar Pradesh, Agra, and Taj Mahal.
    </p>

</body>
</html>
