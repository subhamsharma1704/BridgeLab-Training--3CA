<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined Effects</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
            padding: 50px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 70px;
        }

        .button {
            padding: 15px 30px;
            background: steelblue;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 8px gray;
            transition: all 0.3s ease;
        }

        .button:hover {
            background: purple;
            transform: scale(1.1);
            box-shadow: 0 8px 18px gray;
        }

        .button:active {
            transform: scale(0.95);
        }

        .button:focus {
            outline: 3px solid orange;
            outline-offset: 3px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Combined CSS Effects</h1>
    </header>

    <main class="container">

        <button class="button">Example 1</button>
        <button class="button">Example 2</button>
        <button class="button">Example 3</button>
        <button class="button">Example 4</button>

    </main>

</body>
</html>
