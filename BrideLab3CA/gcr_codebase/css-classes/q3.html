<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial;
            background: #f2f2f2;
            margin: 0;
            padding: 30px;
            text-align: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            max-width: 1000px;
            margin: 40px auto;
        }

        figure {
            margin: 0;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 12px gray;
        }

        .image {
            position: relative;
            overflow: hidden;
        }

        img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            transition: transform 0.4s;
        }

        .image::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0);
            transition: background 0.4s;
        }

        figure:hover img {
            transform: scale(1.1);
        }

        figure:hover .image::after {
            background: rgba(0, 0, 0, 0.3);
        }

        figcaption {
            padding: 15px;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Image Showcase</h1>
    </header>

    <main class="gallery">

        <figure>
            <div class="image">
                <img src="https://picsum.photos/400/250?1" alt="Nature">
            </div>
            <figcaption>Nature</figcaption>
        </figure>

        <figure>
            <div class="image">
                <img src="https://picsum.photos/400/250?2" alt="Mountain">
            </div>
            <figcaption>Mountain</figcaption>
        </figure>

        <figure>
            <div class="image">
                <img src="https://picsum.photos/400/250?3" alt="Forest">
            </div>
            <figcaption>Forest</figcaption>
        </figure>

        <figure>
            <div class="image">
                <img src="https://picsum.photos/400/250?4" alt="Beach">
            </div>
            <figcaption>Beach</figcaption>
        </figure>

        <figure>
            <div class="image">
                <img src="https://picsum.photos/400/250?5" alt="City">
            </div>
            <figcaption>City</figcaption>
        </figure>

        <figure>
            <div class="image">
                <img src="https://picsum.photos/400/250?6" alt="Lake">
            </div>
            <figcaption>Lake</figcaption>
        </figure>

    </main>

</body>
</html>
