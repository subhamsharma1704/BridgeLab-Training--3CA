<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Interface</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: #f2f2f2;
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }

        main {
            min-height: 75vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .card {
            width: 700px;
            background: white;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 15px;
            box-shadow: 0 5px 20px gray;
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .image {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }

        form {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input,
        textarea,
        button {
            padding: 12px;
            border-radius: 7px;
        }

        input,
        textarea {
            border: 1px solid gray;
        }

        input:focus,
        textarea:focus {
            outline: 3px solid lightblue;
        }

        button {
            border: 1px solid steelblue;
            background: steelblue;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #222;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 15px;
        }

        @media (max-width: 700px) {
            .card {
                width: 100%;
                flex-direction: column;
            }

            .image {
                width: 100%;
                max-width: 250px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Mini User Interface</h1>
    </header>

    <main>

        <section class="card">

            <img
                class="image"
                src="https://picsum.photos/300/300"
                alt="Sample Image"
            >

            <form>

                <h2>Contact Us</h2>

                <input
                    type="text"
                    placeholder="Enter your name"
                >

                <input
                    type="email"
                    placeholder="Enter your email"
                >

                <textarea
                    rows="4"
                    placeholder="Enter your message"
                ></textarea>

                <button type="submit">Submit</button>
                <button type="reset">Reset</button>

            </form>

        </section>

    </main>

    <footer>
        <p>© 2026 Mini UI</p>
    </footer>

</body>
</html>
