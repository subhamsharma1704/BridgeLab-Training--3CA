<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tooltips</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
            padding: 50px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 60px;
            margin-top: 100px;
        }

        .item {
            position: relative;
            background: steelblue;
            color: white;
            padding: 20px 30px;
            border-radius: 8px;
            cursor: pointer;
        }

        .tooltip {
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%);
            background: #222;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            white-space: nowrap;
            opacity: 0;
            transition: 0.3s ease-in-out;
        }

        .item:hover .tooltip {
            opacity: 1;
        }
    </style>
</head>

<body>

    <header>
        <h1>CSS Tooltip Demonstration</h1>
    </header>

    <main class="container">

        <div class="item">
            Home
            <span class="tooltip">Go to Home</span>
        </div>

        <div class="item">
            Profile
            <span class="tooltip">View Profile</span>
        </div>

        <div class="item">
            Settings
            <span class="tooltip">Open Settings</span>
        </div>

    </main>

</body>
</html>
