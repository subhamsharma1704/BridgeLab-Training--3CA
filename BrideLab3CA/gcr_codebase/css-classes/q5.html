<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Collection</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
            padding: 50px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 50px;
        }

        button {
            padding: 14px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .primary {
            background: blue;
            color: white;
            border: 2px solid blue;
        }

        .secondary {
            background: gray;
            color: white;
            border: 2px solid gray;
        }

        .outline {
            background: white;
            color: blue;
            border: 2px solid blue;
        }

        .primary:hover,
        .secondary:hover,
        .outline:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 10px gray;
        }

        button:active {
            transform: scale(0.95);
        }

        button:focus {
            outline: 3px solid orange;
            outline-offset: 3px;
        }

        button:disabled {
            background: #ccc;
            color: #666;
            border-color: #aaa;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <header>
        <h1>Styled Button Collection</h1>
    </header>

    <main class="buttons">

        <button class="primary">Primary</button>

        <button class="secondary">Secondary</button>

        <button class="outline">Outline</button>

        <button disabled>Disabled</button>

    </main>

</body>
</html>
