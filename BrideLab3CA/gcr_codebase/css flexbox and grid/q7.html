<!DOCTYPE html>
<html>
<head>
    <title>Loading Animation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .loader {
            display: flex;
            align-items: center;

            gap: 10px;
        }

        .circle {
            width: 20px;
            height: 20px;

            background: #222;

            border-radius: 50%;

            animation: bounce 1s infinite;
        }

        .circle:nth-child(2) {
            animation-delay: 0.2s;
        }

        .circle:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-25px);
            }

        }
    </style>
</head>

<body>

    <div class="loader">

        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>

    </div>

</body>
</html>
