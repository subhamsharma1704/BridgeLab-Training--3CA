<!DOCTYPE html>
<html>
<head>
    <title>Photo Gallery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;

            font-family: Arial, sans-serif;

            background: #f2f2f2;
        }

        h1 {
            text-align: center;
        }

        .gallery {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(200px, 1fr));

            gap: 25px;
        }

        figure {
            margin: 0;

            overflow: hidden;

            background: white;

            border-radius: 10px;

            text-align: center;
        }

        figure img {
            width: 100%;
            height: 250px;

            object-fit: cover;

            display: block;

            transition: transform 0.5s ease;
        }

        figure:hover img {
            transform: scale(1.08);
        }

        figcaption {
            padding: 15px;

            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Photo Gallery</h1>

    <div class="gallery">

        <figure>
            <img src="https://picsum.photos/500/400?random=1"
                 alt="Nature">
            <figcaption>Beautiful Nature</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/500/400?random=2"
                 alt="Mountain">
            <figcaption>Mountain View</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/500/400?random=3"
                 alt="City">
            <figcaption>City Life</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/500/400?random=4"
                 alt="Beach">
            <figcaption>Beautiful Beach</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/500/400?random=5"
                 alt="Forest">
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/500/400?random=6"
                 alt="Lake">
            <figcaption>Peaceful Lake</figcaption>
        </figure>

    </div>

</body>
</html>
