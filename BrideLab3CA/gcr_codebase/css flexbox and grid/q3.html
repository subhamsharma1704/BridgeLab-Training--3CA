<!DOCTYPE html>
<html>
<head>
    <title>Homepage</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 20px;
            background: #222;
            color: white;
            text-align: center;
        }

        nav {
            display: flex;
            justify-content: space-around;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 40px;
        }

        .box {
            flex: 1;
            padding: 50px 20px;
            text-align: center;
            background: #e5e5e5;
            border-radius: 10px;
            transition: 0.3s;
        }

        .box:hover {
            transform: rotate(2deg);
        }

        footer {
            width: 100%;
            text-align: center;
            padding: 20px;
            background: #222;
            color: white;
        }

        @media (max-width: 700px) {
            main {
                flex-direction: column;
            }

            .box {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <header>
        <h1>My Website</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>

        <div class="box">
            <h2>Services</h2>
            <p>We provide quality services.</p>
        </div>

        <div class="box">
            <h2>Projects</h2>
            <p>Our latest projects.</p>
        </div>

        <div class="box">
            <h2>Contact</h2>
            <p>Contact us anytime.</p>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 My Website</p>
    </footer>

</div>

</body>
</html>
