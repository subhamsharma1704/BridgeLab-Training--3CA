<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .dashboard {
            min-height: 100vh;

            display: grid;

            grid-template-columns: 220px 1fr;
            grid-template-rows: 80px 1fr;
        }

        header {
            grid-column: 1 / -1;

            background: #222;
            color: white;

            display: flex;
            align-items: center;

            padding: 20px;
        }

        aside {
            background: #333;
            padding: 20px;

            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        aside a {
            color: white;
            text-decoration: none;
        }

        main {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 20px;
            padding: 30px;

            background: #f2f2f2;
        }

        .box {
            background: white;
            padding: 30px;

            border-radius: 10px;

            transition: 0.3s;
        }

        .box:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px #aaa;
        }

        .box1 {
            grid-column: span 2;
        }

        @media (max-width: 700px) {

            .dashboard {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr;
            }

            header {
                grid-column: 1;
            }

            aside {
                flex-direction: row;
                flex-wrap: wrap;
            }

            main {
                grid-template-columns: 1fr;
            }

            .box1 {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>

<div class="dashboard">

    <header>
        <h1>Dashboard</h1>
    </header>

    <aside>
        <a href="#">Dashboard</a>
        <a href="#">Profile</a>
        <a href="#">Settings</a>
        <a href="#">Logout</a>
    </aside>

    <main>

        <div class="box box1">
            <h2>Total Users</h2>
            <p>1,250</p>
        </div>

        <div class="box">
            <h2>Sales</h2>
            <p>₹75,000</p>
        </div>

        <div class="box">
            <h2>Orders</h2>
            <p>350</p>
        </div>

        <div class="box">
            <h2>Visitors</h2>
            <p>5,400</p>
        </div>

    </main>

</div>

</body>
</html>
