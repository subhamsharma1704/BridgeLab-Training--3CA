<!DOCTYPE html>
<html>
<head>
    <title>Product Gallery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .card {
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 10px #bbb;

            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        @media (max-width: 900px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Product Gallery</h1>

    <div class="gallery">

        <div class="card">
            <h2>Laptop</h2>
            <p>₹50,000</p>
        </div>

        <div class="card">
            <h2>Smartphone</h2>
            <p>₹25,000</p>
        </div>

        <div class="card">
            <h2>Headphones</h2>
            <p>₹2,500</p>
        </div>

        <div class="card">
            <h2>Keyboard</h2>
            <p>₹1,500</p>
        </div>

        <div class="card">
            <h2>Mouse</h2>
            <p>₹800</p>
        </div>

        <div class="card">
            <h2>Monitor</h2>
            <p>₹12,000</p>
        </div>

        <div class="card">
            <h2>Tablet</h2>
            <p>₹20,000</p>
        </div>

        <div class="card">
            <h2>Smart Watch</h2>
            <p>₹3,000</p>
        </div>

    </div>

</body>
</html>
