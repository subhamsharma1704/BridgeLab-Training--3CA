<!DOCTYPE html>
<html>
<head>
    <title>Pricing Section</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px;

            font-family: Arial, sans-serif;

            background: #f2f2f2;
        }

        h1 {
            text-align: center;
        }

        .pricing {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 30px;
        }

        .card {
            flex: 1;
            max-width: 300px;

            padding: 40px 20px;

            text-align: center;

            background: white;

            border-radius: 10px;

            box-shadow: 0 5px 15px #bbb;

            animation: fadeIn 1s ease;

            transition: 0.3s;
        }

        .popular {
            transform: scale(1.08);
            background: #dceeff;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        button {
            padding: 10px 25px;

            border: none;
            border-radius: 5px;

            background: #222;
            color: white;
        }

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        @media (max-width: 750px) {

            .pricing {
                flex-direction: column;
            }

            .card {
                width: 100%;
            }

            .popular {
                transform: none;
            }
        }
    </style>
</head>

<body>

    <h1>Choose Your Plan</h1>

    <div class="pricing">

        <div class="card">
            <h2>Basic</h2>
            <h3>₹499</h3>
            <p>5 Projects</p>
            <p>10 GB Storage</p>
            <button>Choose</button>
        </div>

        <div class="card popular">
            <h2>Pro</h2>
            <h3>₹999</h3>
            <p>20 Projects</p>
            <p>50 GB Storage</p>
            <button>Choose</button>
        </div>

        <div class="card">
            <h2>Premium</h2>
            <h3>₹1,499</h3>
            <p>Unlimited Projects</p>
            <p>100 GB Storage</p>
            <button>Choose</button>
        </div>

    </div>

</body>
</html>
