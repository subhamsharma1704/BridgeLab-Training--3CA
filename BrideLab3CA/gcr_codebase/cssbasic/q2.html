<!DOCTYPE html>
<html>
<head>
    <title>My City</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #444;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 15px;
        }

        section {
            width: 100%;
            padding: 60px 30px;
            box-sizing: border-box;
            margin: 10px 0;
            border: 3px solid #222;
            background-attachment: fixed;
        }

        #about {
            background: linear-gradient(120deg, #74ebd5, #9face6);
        }

        #places {
            background: radial-gradient(circle, #ffd89b, #19547b);
        }

        #food {
            background: linear-gradient(120deg, #ff9a9e, #fad0c4);
        }

        h1 {
            font-size: 40px;
            font-weight: bold;
        }

        h2 {
            font-size: 30px;
            font-weight: bold;
        }

        p {
            font-size: 18px;
            margin: 20px;
        }

        footer {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

<header>
    <h1>About Agra</h1>
</header>

<nav>
    <a href="#about">About</a>
    <a href="#places">Places</a>
    <a href="#food">Food</a>
</nav>

<main>

<section id="about">
    <h2>About Agra</h2>
    <p>Agra is a historic city famous for the Taj Mahal.</p>
</section>

<section id="places">
    <h2>Famous Places</h2>
    <p>Taj Mahal, Agra Fort and Fatehpur Sikri are popular attractions.</p>
</section>

<section id="food">
    <h2>Local Food</h2>
    <p>Agra is famous for its delicious Petha and Mughlai food.</p>
</section>

</main>

<footer>
    <p>© 2026 My City</p>
</footer>

</body>
</html>
