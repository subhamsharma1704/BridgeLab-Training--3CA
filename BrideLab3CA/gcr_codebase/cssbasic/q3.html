<!DOCTYPE html>
<html>
<head>
    <title>Team Members</title>

    <style>
        .team {
            display: flex;
        }

        .card {
            flex: 1;
            margin: 15px;
            padding: 20px;
            border: 2px solid #333;
            border-radius: 10px;
            box-shadow: 2px 2px 10px gray;
        }

        .lead {
            background: lightblue;
            border: 3px dashed blue;
        }

        @media (max-width: 600px) {
            .team {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<h1>Team Members</h1>

<div class="team">

    <div class="card lead">
        <h2>Kushagra</h2>
        <h3>Team Lead</h3>
        <p>Leads the team and manages projects.</p>
    </div>

    <div class="card">
        <h2>Rahul</h2>
        <h3>Developer</h3>
        <p>Develops and maintains applications.</p>
    </div>

    <div class="card">
        <h2>Aman</h2>
        <h3>Designer</h3>
        <p>Designs user interfaces and graphics.</p>
    </div>

</div>

</body>
</html>
