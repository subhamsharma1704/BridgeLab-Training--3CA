<!DOCTYPE html>
<html>
<head>
    <title>Photo Gallery</title>

    <style>
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .photo {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 2px 2px 10px gray;
        }

        .photo img {
            width: 100%;
            display: block;
            transition: 0.3s;
        }

        .caption {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: black;
            color: white;
            text-align: center;
            opacity: 0;
            padding: 10px 0;
            transition: 0.3s;
        }

        .photo:hover img {
            transform: scale(1.1);
        }

        .photo:hover .caption {
            opacity: 1;
        }

        @media (max-width: 800px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<h1>Photo Gallery</h1>

<div class="gallery">

    <div class="photo">
        <img src="https://picsum.photos/400/300?1">
        <div class="caption">Nature</div>
    </div>

    <div class="photo">
        <img src="https://picsum.photos/400/300?2">
        <div class="caption">Mountain</div>
    </div>

    <div class="photo">
        <img src="https://picsum.photos/400/300?3">
        <div class="caption">Forest</div>
    </div>

    <div class="photo">
        <img src="https://picsum.photos/400/300?4">
        <div class="caption">Beach</div>
    </div>

    <div class="photo">
        <img src="https://picsum.photos/400/300?5">
        <div class="caption">City</div>
    </div>

    <div class="photo">
        <img src="https://picsum.photos/400/300?6">
        <div class="caption">Sunset</div>
    </div>

</div>

</body>
</html>
