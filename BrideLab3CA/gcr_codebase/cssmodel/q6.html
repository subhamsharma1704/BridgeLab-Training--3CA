<!DOCTYPE html>
<html>
<head>
    <title>CSS Transformations</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f2f2f2;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 60px;
            margin-top: 80px;
            flex-wrap: wrap;
        }

        .item {
            text-align: center;
        }

        .box {
            width: 120px;
            height: 120px;
            background: steelblue;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.4s ease;
        }

        .rotate:hover {
            transform: rotate(30deg);
        }

        .scale:hover {
            transform: scale(1.3);
        }

        .translate:hover {
            transform: translateY(-30px);
        }

        .skew:hover {
            transform: skew(20deg);
        }
    </style>
</head>

<body>

    <h1>CSS Transformations</h1>

    <main class="container">

        <div class="item">
            <div class="box rotate">Rotate</div>
            <p>rotate()</p>
        </div>

        <div class="item">
            <div class="box scale">Scale</div>
            <p>scale()</p>
        </div>

        <div class="item">
            <div class="box translate">Move</div>
            <p>translate()</p>
        </div>

        <div class="item">
            <div class="box skew">Skew</div>
            <p>skew()</p>
        </div>

    </main>

</body>
</html>
