<!DOCTYPE html>
<html>
<head>
    <title>Gradient Background</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: #222;
            color: white;
            text-align: center;
            padding: 15px;
            z-index: 10;
        }

        section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .linear {
            background: linear-gradient(to right, blue, purple);
            background-attachment: fixed;
        }

        .radial {
            background: radial-gradient(circle, orange, red, darkred);
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #222;
            color: white;
            text-align: center;
            padding: 8px;
        }
    </style>
</head>

<body>

    <header>
        <h1>CSS Gradients</h1>
    </header>

    <main>

        <section class="linear">
            <h2>Linear Gradient</h2>
            <p>This section uses a linear gradient.</p>
        </section>

        <section class="radial">
            <h2>Radial Gradient</h2>
            <p>This section uses a radial gradient.</p>
        </section>

    </main>

    <footer>
        Gradient Practice Page
    </footer>

</body>
</html>
