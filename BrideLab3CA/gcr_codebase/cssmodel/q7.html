<!DOCTYPE html>
<html>
<head>
    <title>Typography</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
        }

        header {
            text-align: center;
            padding: 20px;
        }

        article {
            max-width: 700px;
            margin: 30px auto;
            background: white;
            padding: 30px;
        }

        h2 {
            font-family: Georgia, serif;
            font-size: 28px;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
            letter-spacing: 1px;
            text-align: justify;
        }

        strong {
            color: blue;
        }

        em {
            color: green;
        }

        mark {
            background: yellow;
            color: red;
        }

        p::first-letter {
            font-size: 40px;
            font-weight: bold;
        }

        p::first-line {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h1>Typography and Text Styling</h1>
    </header>

    <main>

        <article>

            <h2>Web Development</h2>

            <p>
                Web development is the process of creating websites.
                <strong>HTML</strong> provides structure,
                <em>CSS</em> provides styling, and
                <mark>JavaScript</mark> adds functionality.
            </p>

            <p>
                Good typography makes a webpage easier to read.
                Proper spacing and font selection improve the overall design.
            </p>

        </article>

    </main>

</body>
</html>
